databaseChangeLog:
  - changeSet:
      id: 002-create-transactions-table
      author: arca
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: account_from
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: account_to
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: currency_shortname
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: sum
                  type: NUMERIC(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: sum_usd
                  type: NUMERIC(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: expense_category
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: limit_exceeded
                  type: BOOLEAN
                  constraints:
                    nullable: false

              - column:
                  name: limit_id
                  type: BIGINT
                  constraints:
                    nullable: true

              - column:
                  name: datetime
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

        - sql:
            sql: |
              ALTER TABLE transactions 
              ADD CONSTRAINT chk_transactions_expense_category 
              CHECK (expense_category IN ('PRODUCT', 'SERVICE'))

        - sql:
            sql: |
              ALTER TABLE transactions 
              ADD CONSTRAINT chk_transactions_sum_positive 
              CHECK (sum > 0)

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: limit_id
            referencedTableName: limits
            referencedColumnNames: id
            constraintName: fk_transactions_limit
            onDelete: SET NULL
