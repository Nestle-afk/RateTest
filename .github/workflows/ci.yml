name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (compile + test compile)
        run: mvn clean compile test-compile --batch-mode

      - name: Run Tests
        run: mvn test --batch-mode

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Nestle-afk_RateTest
            -Dsonar.organization=nestle-afk
            -Dsonar.java.binaries=target/classes

      - name: Build Docker Image
        run: docker build -t rate-api:latest .

      - name: Save Docker Image as Artifact
        run: |
          docker save rate-api:latest -o rate-api.tar

      - name: Upload Docker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rate-api-docker-image
          path: rate-api.tar